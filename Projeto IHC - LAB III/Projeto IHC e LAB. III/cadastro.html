
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyUp</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h1>StudyUp</h1>
        <p>Seu futuro começa com uma oportunidade!</p>
    </header>

    <main>
        <section>
            <article>
                <h2>Crie sua conta</h2>
                <p>Cadastre-se e comece sua jornada profissional.</p>

                <form class="form-cadastro" id="form-cadastro">
                    <p><label for="nome">Nome completo:</label>
                        <input type="text" id="nome"
                        placeholder="Digite seu nome" required></p>

                    <p><label for="email">E-mail:</label>
                        <input type="email" id="email"
                        placeholder="Digite seu e-mail" required></p>

                    <p><label for="senha">Senha:</label>
                        <input type="password" id="senha"
                        placeholder="Crie uma senha" required></p>

                    <p><label for="confirmar">Confirmar senha:</label>
                        <input type="password" id="confirmar"
                        placeholder="Digite a senha novamente" required></p>

                    <p><label for="curso">Curso de interesse:</label>
                        <select id="curso" required>
                            <option value="">Selecione um curso</option>
                            <option value="direito">Direito</option>
                            <option value="sistemas">Sistemas de Informação</option>
                            <option value="medicina">Medicina</option>
                        </select></p>

                    <button type="submit">Criar conta</button>
                </form>

                <p>Já tem uma conta? <a href="login.html">Entrar</a></p>

                <p><a href="index.html">Voltar ao início</a></p>
            </article>
        </section>
    </main>

    <aside><p>StudyUp - Conectando você ao seu futuro.</p></aside>

</body>
</html>
